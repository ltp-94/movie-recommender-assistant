[project]
name = "movie-recommender-assistant"
version = "0.1.0"
description = "Movie Recommender Assistant with CPU-only PyTorch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "elasticsearch<9.0.0",
    "fastapi>=0.141.1",
    "gdown>=6.1.0",
    "google-genai>=2.18.1",
    "google-generativeai>=0.8.6",
    "openai>=3.0.0",
    "polars>=1.43.2",
    "psycopg2-binary>=2.9.12",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=5.7.0",
    "streamlit>=1.59.1",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "uvicorn>=0.52.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
